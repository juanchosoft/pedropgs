[app]
env = "local"
base_url = "http://localhost/pgscentrum"
public_base_url = ""
private_dir = "C:/wamp64/pgscentrum_private/storage"
business_timezone = "America/New_York"
currency = "USD"
legacy_utc_offset_hours = -4
app_secret = ""

[database_test]
host = "localhost"
name = "pgscentrum_test"
user = "root"
pass = ""

[api]
trust_proxy = 0
default_rate_per_minute = 600

[anthropic]
api_key = ""
model = "claude-sonnet-5"
max_tokens = 16000
effort = "medium"
rate_limit_per_hour = 30
max_iter = 10
history_messages = 30
assistant_name = "PGS Assistant"
timeout_seconds = 120

[elevenlabs]
api_key = ""
voice_id = ""
tts_model = "eleven_flash_v2_5"
stt_model = "scribe_v1"
agent_id = ""
webhook_init_secret = ""
webhook_postcall_secret = ""
allow_overrides = 1

[ia_attachments]
enabled = 1
max_files_per_message = 5
max_uploads_per_hour = 20

[voice]
default_region = "US"
session_ttl_minutes = 30
retention_days = 180
business_hours = "mon-fri 08:00-17:00"
holidays_file = ""
escalation_number = ""
reservation_horizon_days = 60

[leave]
counted_weekdays = "mon,tue,wed,thu,fri"
deductible_reasons = "vacation,personal"
max_request_days = 30

[expenses]
max_line_amount = 10000
staff_edit_window_hours = 24

[notifications]
due_soon_hours = 24
default_lang = "es"

[whatsapp]
enabled = 0
graph_version = "v23.0"
phone_number_id = ""
waba_id = ""
access_token = ""
app_secret = ""
verify_token = ""

[smtp_notifications]
enabled = 0
host = ""
port = 587
encryption = "tls"
username = ""
password = ""
from_email = ""
from_name = "PGS Centrum"

[google]
enabled = 0
credentials_file = ""
spreadsheet_id = ""
calendar_id = ""
sheets_enabled = 1
calendar_enabled = 1
event_prefix = "pgsd"
